<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoosFind Housing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-blue-800">HoosFind Housing</h1>
            <p class="text-gray-500 mt-2">AI-powered off-grounds housing & roommate matching</p>
        </header>

        <div id="formView" class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-semibold mb-6 border-b pb-2">Your Housing Profile</h2>
            <form id="preferencesForm" class="space-y-8">
                
                <div>
                    <h3 class="text-lg font-bold mb-4 text-gray-700">The Basics</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Max Budget ($/mo)</label>
                            <input type="number" id="budget" value="1200" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Max Distance to Grounds (miles)</label>
                            <input type="number" step="0.1" id="distance" value="1.5" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Preferred Location</label>
                            <select id="location" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500">
                                <option value="any">Anywhere</option>
                                <option value="corner">The Corner</option>
                                <option value="jpa">JPA</option>
                                <option value="preston">Preston Ave / 10th & Dairy</option>
                                <option value="stonefield">Stonefield / 29 North</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Bedrooms Needed</label>
                            <select id="bedrooms" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500">
                                <option value="studio">Studio</option>
                                <option value="1">1 Bedroom</option>
                                <option value="2">2 Bedrooms</option>
                                <option value="3">3 Bedrooms</option>
                                <option value="4+">4+ Bedrooms</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="border-t pt-6">
                    <h3 class="text-lg font-bold mb-4 text-gray-700">Must-Have Amenities</h3>
                    <p class="text-sm text-gray-500 mb-4">Select the features you care about most. Our AI will calculate an overall amenity match score.</p>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="am_laundry" class="rounded text-blue-600 focus:ring-blue-500 h-4 w-4">
                            <span class="text-sm">In-Unit Washer/Dryer</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="am_parking" class="rounded text-blue-600 focus:ring-blue-500 h-4 w-4">
                            <span class="text-sm">On-Site Parking</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="am_fitness" class="rounded text-blue-600 focus:ring-blue-500 h-4 w-4">
                            <span class="text-sm">Fitness Center</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="am_pool" class="rounded text-blue-600 focus:ring-blue-500 h-4 w-4">
                            <span class="text-sm">Pool</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="am_ac" class="rounded text-blue-600 focus:ring-blue-500 h-4 w-4">
                            <span class="text-sm">Central A/C</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="am_furniture" class="rounded text-blue-600 focus:ring-blue-500 h-4 w-4">
                            <span class="text-sm">Furnished Options</span>
                        </label>
                    </div>
                </div>

                <div class="border-t pt-6 bg-blue-50 p-6 rounded-lg -mx-4 md:mx-0">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold text-blue-900">Roommate Matching (Optional)</h3>
                        <label class="flex items-center cursor-pointer">
                            <div class="relative">
                                <input type="checkbox" id="seekingRoommate" class="sr-only" onchange="toggleRoommateSection()">
                                <div class="block bg-gray-300 w-10 h-6 rounded-full shadow-inner"></div>
                                <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition transform duration-300"></div>
                            </div>
                            <span class="ml-3 text-sm font-medium text-gray-700">Enable</span>
                        </label>
                    </div>
                    
                    <div id="roommateFields" class="grid grid-cols-1 md:grid-cols-3 gap-4 opacity-50 pointer-events-none transition-opacity duration-300">
                        <div>
                            <label class="block text-sm font-medium mb-1">Sleep Schedule</label>
                            <select id="rm_sleep" class="w-full border border-gray-300 rounded p-2">
                                <option value="early">Early Bird (Before 11PM)</option>
                                <option value="flexible">Flexible</option>
                                <option value="night">Night Owl (After 1AM)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Study Habits</label>
                            <select id="rm_study" class="w-full border border-gray-300 rounded p-2">
                                <option value="quiet">Quiet / Library Style</option>
                                <option value="moderate">Headphones On</option>
                                <option value="vocal">Group / Vocal Study</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Cleanliness</label>
                            <select id="rm_clean" class="w-full border border-gray-300 rounded p-2">
                                <option value="neat">Very Neat</option>
                                <option value="moderate">Average</option>
                                <option value="relaxed">Relaxed / Messy</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-800 text-white font-bold py-4 rounded-xl shadow-md hover:bg-blue-900 transition text-lg mt-4">
                    Run AI Matching Algorithm
                </button>
            </form>
        </div>

        <div id="resultsView" class="hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row gap-4 items-center">
                <input type="text" id="refinePrompt" placeholder="Prompt the AI: e.g., 'Actually, I really need it to be walking distance to the engineering building.'" class="flex-1 border border-gray-300 rounded-lg p-3 w-full">
                <button onclick="alert('This will send a natural language update to the backend!')" class="bg-blue-600 text-white font-bold px-6 py-3 rounded-lg hover:bg-blue-700 w-full md:w-auto">Refine</button>
                <button onclick="resetForm()" class="text-sm text-gray-500 hover:text-gray-800 underline whitespace-nowrap">Start Over</button>
            </div>

            <div class="flex justify-between items-end mb-4">
                <h2 class="text-2xl font-bold text-gray-800">Top Algorithm Matches</h2>
                <span class="text-sm text-gray-500">Based on your preferences</span>
            </div>
            
            <div id="resultsList" class="space-y-4">
                </div>
        </div>
    </div>

    <style>
        /* CSS for the toggle switch animation */
        input:checked ~ .dot { transform: translateX(100%); background-color: #2563eb; }
        input:checked ~ .block { background-color: #bfdbfe; }
    </style>

    <script>
        // Toggle the roommate fields based on the switch
        function toggleRoommateSection() {
            const isChecked = document.getElementById('seekingRoommate').checked;
            const fields = document.getElementById('roommateFields');
            if (isChecked) {
                fields.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                fields.classList.add('opacity-50', 'pointer-events-none');
            }
        }

        // Handle Form Submission
        document.getElementById('preferencesForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Collect Data and structure it neatly for the backend AI
            const payload = {
                basics: {
                    budget: parseInt(document.getElementById('budget').value),
                    distance: parseFloat(document.getElementById('distance').value),
                    location: document.getElementById('location').value,
                    bedrooms: document.getElementById('bedrooms').value
                },
                amenities: {
                    laundry: document.getElementById('am_laundry').checked,
                    parking: document.getElementById('am_parking').checked,
                    fitness: document.getElementById('am_fitness').checked,
                    pool: document.getElementById('am_pool').checked,
                    ac: document.getElementById('am_ac').checked,
                    furniture: document.getElementById('am_furniture').checked
                },
                roommate_matching: {
                    enabled: document.getElementById('seekingRoommate').checked,
                    sleep_schedule: document.getElementById('rm_sleep').value,
                    study_habits: document.getElementById('rm_study').value,
                    cleanliness: document.getElementById('rm_clean').value
                }
            };

            console.log("Sending payload to backend:", payload);

            try {
                // Send data to Python (FastAPI)
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Receive the response from Python
                const data = await response.json();

                // Pass the data received from Python to the UI
                console.log("Backend response:", data);
                renderResults(data.results);
                
                // Swap Views
                document.getElementById('formView').classList.add('hidden');
                document.getElementById('resultsView').classList.remove('hidden');

            } catch (error) {
                console.error("Error connecting to backend:", error);
                alert("Something went wrong connecting to the server. Check the terminal for details.");
            }
        });

function renderResults(results) {
            const container = document.getElementById('resultsList');

            container.innerHTML = results.map(item => {
                const beds = item.bedrooms != null ? `${item.bedrooms} Bed` : 'N/A';
                const dist = item.distance != null ? `${item.distance} mi to UVa` : 'Distance N/A';
                const amenityScore = item.score_breakdown ? item.score_breakdown.amenities_score : 'N/A';
                return `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center hover:shadow-md transition gap-6">
                    
                    <div class="mb-4 md:mb-0 flex-1 min-w-0 w-full">
                        
                        <div class="flex flex-wrap items-center gap-3 mb-1">
                            <h3 class="font-bold text-xl text-blue-900 break-words">${item.name}</h3>
                            <span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded font-semibold whitespace-nowrap shrink-0">${beds}</span>
                        </div>
                        <p class="text-gray-600 font-medium">${item.price}/mo • ${dist}</p>

                        <div class="mt-3 flex flex-wrap gap-2">
                            ${(item.amenities || []).map(am => `<span class="bg-green-50 border border-green-200 text-green-700 text-xs px-2 py-1 rounded-full whitespace-nowrap">${am}</span>`).join('')}
                        </div>
                    </div>

                    <div class="flex flex-row md:flex-col gap-4 md:gap-1 text-center bg-gray-50 md:bg-transparent p-3 md:p-0 rounded w-full md:w-auto shrink-0">
                        <div>
                            <div class="text-3xl font-black text-blue-600">${item.overall_score}%</div>
                            <div class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Total Match</div>
                        </div>
                        <div class="hidden md:block w-full h-[1px] bg-gray-200 my-1"></div>
                        <div>
                            <div class="text-lg font-bold text-gray-700">${amenityScore}%</div>
                            <div class="text-[10px] text-gray-400 uppercase tracking-wider">Amenity Score</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function resetForm() {
            document.getElementById('resultsView').classList.add('hidden');
            document.getElementById('formView').classList.remove('hidden');
        }
    </script>
</body>
</html>
